const App = {
  currentView: 'category',
  currentCategory: 'math',
  currentFormula: null,
  favorites: Storage.get('efc_favorites', []),
  history: Storage.get('efc_history', []),
  theme: Storage.get('efc_theme', 'dark'),
  searchQuery: '',
  inputValues: {},
  unitValues: {},
  lastResult: null,
  lastSteps: null,
  lastFormula: null
};

/* ============================================================
   INITIALIZATION
   ============================================================ */
function init() {
  applyTheme();
  renderSidebar();
  renderMobileCats();
  renderCategory(App.currentCategory);
  bindEvents();
  updateBadges();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', App.theme === 'light' ? 'light' : 'dark');
}

function toggleTheme() {
  App.theme = App.theme === 'light' ? 'dark' : 'light';
  Storage.set('efc_theme', App.theme);
  applyTheme();
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderSidebar() {
  const el = document.getElementById('sidebarCats');
  if (!el) return;
  el.innerHTML = CATEGORIES.map(c => {
    const count = FORMULAS.filter(f => f.cat === c.id).length;
    return `<div class="cat-item ${c.id === App.currentCategory ? 'active' : ''}" data-cat="${c.id}" tabindex="0" role="button">
      ${Icons[c.icon] || Icons.math}
      <div class="cat-item-text">
        <div class="cat-item-name">${escapeHtml(c.name)}</div>
        <div class="cat-item-count">${count} calculator${count !== 1 ? 's' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function renderMobileCats() {
  const el = document.getElementById('mobileCats');
  if (!el) return;
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="chip ${c.id === App.currentCategory ? 'active' : ''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`
  ).join('');
}

function renderCategory(catId) {
  App.currentCategory = catId;
  App.currentView = 'category';
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return;

  document.getElementById('catTitle').textContent = cat.name;
  document.getElementById('catDesc').textContent = cat.desc;
  document.getElementById('categoryView').classList.remove('hidden');
  document.getElementById('calcView').classList.add('hidden');
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('favView').classList.add('hidden');
  document.getElementById('historyView').classList.add('hidden');

  const formulas = FORMULAS.filter(f => f.cat === catId);
  const grid = document.getElementById('formulaGrid');
  grid.innerHTML = formulas.map(f => formulaCardHTML(f)).join('');

  // Update active states
  document.querySelectorAll('.cat-item').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === catId);
  });
  document.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === catId);
  });
}

function formulaCardHTML(f) {
  const isFav = App.favorites.includes(f.id);
  return `<div class="formula-card" data-formula="${f.id}" tabindex="0" role="button">
    <div class="formula-card-top">
      <div class="formula-card-name">${escapeHtml(f.name)}</div>
      <button class="formula-card-fav ${isFav ? 'active' : ''}" data-fav="${f.id}" title="${isFav ? 'Remove from' : 'Add to'} favorites" aria-label="${isFav ? 'Remove from' : 'Add to'} favorites">
        ${isFav ? Icons.starFill : Icons.star}
      </button>
    </div>
    <div class="formula-card-eq">${escapeHtml(f.eq)}</div>
    <div class="formula-card-desc">${escapeHtml(f.desc)}</div>
  </div>`;
}

function openFormula(id) {
  const f = FORMULAS.find(x => x.id === id);
  if (!f) return;
  App.currentFormula = f;
  App.currentView = 'calc';
  App.inputValues = {};
  App.unitValues = {};
  App.lastResult = null;
  App.lastSteps = null;
  App.lastFormula = f;

  document.getElementById('categoryView').classList.add('hidden');
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('favView').classList.add('hidden');
  document.getElementById('historyView').classList.add('hidden');
  document.getElementById('calcView').classList.remove('hidden');

  renderCalculator(f);
}

function renderCalculator(f) {
  const el = document.getElementById('calcView');
  const isFav = App.favorites.includes(f.id);

  // Build inputs
  let inputsHTML = '';
  f.inputs.forEach(inp => {
    const unitOptions = inp.unitType === 'select' ? inp.options :
                        inp.unitType === 'text' ? null :
                        getUnitOptions(inp.unitType);
    const defaultUnit = inp.defaultUnit || (unitOptions ? unitOptions[0] : '');
    App.unitValues[inp.id] = defaultUnit;

    if (inp.unitType === 'select') {
      inputsHTML += `<div class="input-group">
        <label for="inp_${inp.id}">${escapeHtml(inp.label)}</label>
        <div class="input-row">
          <select id="inp_${inp.id}" data-input="${inp.id}">
            ${inp.options.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
          </select>
        </div>
        <div class="input-error-msg" id="err_${inp.id}"></div>
      </div>`;
    } else if (inp.unitType === 'text') {
      inputsHTML += `<div class="input-group">
        <label for="inp_${inp.id}">${escapeHtml(inp.label)}</label>
        <div class="input-row">
          <input type="text" id="inp_${inp.id}" data-input="${inp.id}" placeholder="e.g. 1, 2, 3">
        </div>
        <div class="input-error-msg" id="err_${inp.id}"></div>
      </div>`;
    } else {
      inputsHTML += `<div class="input-group">
        <label for="inp_${inp.id}">${escapeHtml(inp.label)} <span class="unit-hint">(${escapeHtml(defaultUnit || 'SI')})</span></label>
        <div class="input-row">
          <input type="number" step="any" id="inp_${inp.id}" data-input="${inp.id}" placeholder="Enter value">
          <select data-unit="${inp.id}" aria-label="Unit for ${escapeHtml(inp.label)}">
            ${unitOptions.map(u => `<option value="${escapeHtml(u)}" ${u === defaultUnit ? 'selected' : ''}>${escapeHtml(u)}</option>`).join('')}
          </select>
        </div>
        <div class="input-error-msg" id="err_${inp.id}"></div>
      </div>`;
    }
  });

  // Outputs
  let outputsHTML = '';
  f.outputs.forEach(o => {
    const unitOptions = o.unitType === 'text' ? null : getUnitOptions(o.unitType);
    if (unitOptions && unitOptions.length > 0 && o.unitType !== 'text') {
      outputsHTML += `<div class="result-detail" style="margin-top:4px;">
        <div class="kv">
          <span class="k">${escapeHtml(o.label)}</span>
          <span class="v" id="out_${o.id}">—</span>
        </div>
      </div>`;
    }
  });

  el.innerHTML = `<div class="calc-panel">
    <div class="calc-header">
      <div class="calc-header-info">
        <h3>${escapeHtml(f.name)}</h3>
        <p>${escapeHtml(f.desc)}</p>
      </div>
      <div class="calc-header-actions">
        <button class="btn btn-secondary btn-sm" id="backBtn" title="Back to category">${Icons.back} Back</button>
        <button class="btn btn-secondary btn-sm" id="favBtn" title="Toggle favorite">${isFav ? Icons.starFill : Icons.star} ${isFav ? 'Saved' : 'Save'}</button>
      </div>
    </div>
    <div class="calc-equation">${escapeHtml(f.eq)}</div>
    <div class="calc-body">
      <div class="calc-inputs">
        <h4>Inputs</h4>
        ${inputsHTML}
        <div class="calc-actions">
          <button class="btn btn-primary" id="calcBtn">${Icons.calculate} Calculate</button>
          <button class="btn btn-secondary" id="exampleBtn">${Icons.example} Load Example</button>
          <button class="btn btn-secondary" id="resetBtn">${Icons.reset} Reset</button>
        </div>
      </div>
      <div class="calc-results">
        <h4>Results</h4>
        <div class="result-card" id="resultCard" aria-live="polite">
          <div class="result-placeholder">Enter values and click Calculate</div>
        </div>
        ${outputsHTML}
      </div>
    </div>
    <div class="steps-section">
      <h4 id="stepsToggle" class="collapsed">${Icons.chevron} Step-by-Step Solution</h4>
      <div class="steps-content hidden" id="stepsContent"></div>
    </div>
    <div class="assumptions">
      <strong>Assumptions & Limitations:</strong> ${escapeHtml(f.assumptions)}
    </div>
  </div>`;

  // Bind events
  document.getElementById('backBtn').addEventListener('click', () => {
    renderCategory(App.currentCategory);
  });
  document.getElementById('favBtn').addEventListener('click', () => toggleFavorite(f.id));
  document.getElementById('calcBtn').addEventListener('click', calculate);
  document.getElementById('exampleBtn').addEventListener('click', loadExample);
  document.getElementById('resetBtn').addEventListener('click', resetInputs);
  document.getElementById('stepsToggle').addEventListener('click', () => {
    const c = document.getElementById('stepsContent');
    const t = document.getElementById('stepsToggle');
    c.classList.toggle('hidden');
    t.classList.toggle('collapsed');
  });
}

function loadExample() {
  const f = App.currentFormula;
  if (!f || !f.example) return;
  const ex = f.example;
  Object.keys(ex).forEach(key => {
    const inp = f.inputs.find(i => i.id === key);
    if (!inp) return;
    if (inp.unitType === 'select') {
      const sel = document.getElementById(`inp_${key}`);
      if (sel) sel.value = ex[key];
    } else {
      const el = document.getElementById(`inp_${key}`);
      if (el) el.value = ex[key];
    }
  });
  calculate();
}

function resetInputs() {
  const f = App.currentFormula;
  if (!f) return;
  f.inputs.forEach(inp => {
    if (inp.unitType === 'select') {
      const sel = document.getElementById(`inp_${inp.id}`);
      if (sel) sel.selectedIndex = 0;
    } else {
      const el = document.getElementById(`inp_${inp.id}`);
      if (el) el.value = '';
    }
    const err = document.getElementById(`err_${inp.id}`);
    if (err) err.textContent = '';
    const inpEl = document.getElementById(`inp_${inp.id}`);
    if (inpEl) inpEl.classList.remove('error');
  });
  App.lastResult = null;
  App.lastSteps = null;
  document.getElementById('resultCard').innerHTML = '<div class="result-placeholder">Enter values and click Calculate</div>';
  document.getElementById('stepsContent').classList.add('hidden');
  document.getElementById('stepsToggle').classList.add('collapsed');
  f.outputs.forEach(o => {
    const el = document.getElementById(`out_${o.id}`);
    if (el) el.textContent = '—';
  });
}

function calculate() {
  const f = App.currentFormula;
  if (!f) return;

  // Clear errors
  f.inputs.forEach(inp => {
    const err = document.getElementById(`err_${inp.id}`);
    if (err) err.textContent = '';
    const el = document.getElementById(`inp_${inp.id}`);
    if (el) el.classList.remove('error');
  });

  // Collect values
  const values = {};
  let hasError = false;

  f.inputs.forEach(inp => {
    const el = document.getElementById(`inp_${inp.id}`);
    const errEl = document.getElementById(`err_${inp.id}`);
    if (!el) return;

    if (inp.unitType === 'select') {
      values[inp.id] = el.value;
    } else if (inp.unitType === 'text') {
      values[inp.id] = el.value.trim();
    } else {
      const raw = el.value.trim();
      if (raw === '') {
        // Allow missing only if not strictly required? For simplicity, all are required
        el.classList.add('error');
        if (errEl) errEl.textContent = 'This field is required.';
        hasError = true;
        return;
      }
      const num = parseFloat(raw);
      if (!isFinite(num)) {
        el.classList.add('error');
        if (errEl) errEl.textContent = 'Enter a valid number.';
        hasError = true;
        return;
      }
      // Get unit
      const unitSel = document.querySelector(`[data-unit="${inp.id}"]`);
      const unit = unitSel ? unitSel.value : inp.defaultUnit;
      App.unitValues[inp.id] = unit;
      // Convert to base
      const baseVal = toBase(num, unit, inp.unitType);
      values[inp.id] = baseVal;
    }
  });

  if (hasError) {
    document.getElementById('resultCard').innerHTML = '<div class="result-placeholder" style="color:var(--error)">Please fix the errors above.</div>';
    document.getElementById('stepsContent').classList.add('hidden');
    document.getElementById('stepsToggle').classList.add('collapsed');
    App.lastResult = null;
    App.lastSteps = null;
    return;
  }

  // Run calculation
  let result, steps;
  try {
    result = f.calc(values);
    steps = f.steps(values, result);
  } catch(e) {
    document.getElementById('resultCard').innerHTML = `<div class="result-placeholder" style="color:var(--error)">${escapeHtml(e.message || 'Unable to calculate. Check your inputs.')}</div>`;
    document.getElementById('stepsContent').classList.add('hidden');
    document.getElementById('stepsToggle').classList.add('collapsed');
    App.lastResult = null;
    App.lastSteps = null;
    return;
  }

  // Check for non-finite results
  for (const key in result) {
    const v = result[key];
    if (typeof v === 'number' && !isFinite(v)) {
      document.getElementById('resultCard').innerHTML = `<div class="result-placeholder" style="color:var(--error)">Calculation produced an invalid result (non-finite). Please check inputs.</div>`;
      document.getElementById('stepsContent').classList.add('hidden');
      document.getElementById('stepsToggle').classList.add('collapsed');
      App.lastResult = null;
      App.lastSteps = null;
      return;
    }
  }

  // Display results
  App.lastResult = result;
  App.lastSteps = steps;
  App.lastFormula = f;

  const resultCard = document.getElementById('resultCard');
  let resultHTML = '';

  // Determine main output: first output
  const mainOut = f.outputs[0];
  if (mainOut) {
    let displayVal = result[mainOut.id];
    let displayUnit = '';
    if (typeof displayVal === 'number') {
      // Convert to display unit
      const outUnit = mainOut.defaultUnit;
      displayUnit = outUnit;
      if (mainOut.unitType !== 'text' && mainOut.unitType !== 'dimensionless') {
        displayVal = fromBase(displayVal, outUnit, mainOut.unitType);
      }
      resultHTML = `<div class="result-main">${fmtNum(displayVal)} <span class="result-unit">${escapeHtml(displayUnit)}</span></div>`;
    } else {
      resultHTML = `<div class="result-main">${escapeHtml(String(displayVal))}</div>`;
    }
  }

  // Detail outputs
  let detailHTML = '';
  f.outputs.forEach((o, idx) => {
    if (idx === 0) return; // skip main
    let v = result[o.id];
    if (v === undefined) return;
    let unit = o.defaultUnit;
    if (typeof v === 'number' && o.unitType !== 'text' && o.unitType !== 'dimensionless') {
      v = fromBase(v, unit, o.unitType);
    }
    detailHTML += `<div class="kv"><span class="k">${escapeHtml(o.label)}</span><span class="v">${typeof v === 'number' ? fmtNum(v) : escapeHtml(String(v))} ${escapeHtml(unit)}</span></div>`;
  });

  resultCard.innerHTML = resultHTML + (detailHTML ? `<div class="result-detail">${detailHTML}</div>` : '');

  // Update inline output spans
  f.outputs.forEach(o => {
    const el = document.getElementById(`out_${o.id}`);
    if (!el) return;
    let v = result[o.id];
    if (v === undefined) { el.textContent = '—'; return; }
    let unit = o.defaultUnit;
    if (typeof v === 'number' && o.unitType !== 'text' && o.unitType !== 'dimensionless') {
      v = fromBase(v, unit, o.unitType);
    }
    el.textContent = (typeof v === 'number' ? fmtNum(v) : String(v)) + (unit ? ' ' + unit : '');
  });

  // Steps
  document.getElementById('stepsContent').textContent = steps;
  document.getElementById('stepsContent').classList.remove('hidden');
  document.getElementById('stepsToggle').classList.remove('collapsed');

  // Save to history
  saveHistory(f, values, result);
}

/* ============================================================
   FAVORITES
   ============================================================ */
function toggleFavorite(id) {
  const idx = App.favorites.indexOf(id);
  if (idx >= 0) {
    App.favorites.splice(idx, 1);
  } else {
    App.favorites.push(id);
  }
  Storage.set('efc_favorites', App.favorites);
  updateBadges();
  // Re-render current view
  if (App.currentView === 'category') renderCategory(App.currentCategory);
  if (App.currentView === 'search' && App.searchQuery) performSearch(App.searchQuery);
  if (App.currentView === 'calc' && App.currentFormula) {
    const btn = document.getElementById('favBtn');
    if (btn) {
      const isFav = App.favorites.includes(App.currentFormula.id);
      btn.innerHTML = `${isFav ? Icons.starFill : Icons.star} ${isFav ? 'Saved' : 'Save'}`;
    }
  }
}

function updateBadges() {
  const favBadge = document.getElementById('favBadge');
  const histBadge = document.getElementById('historyBadge');
  if (favBadge) {
    favBadge.textContent = App.favorites.length;
    favBadge.classList.toggle('hidden', App.favorites.length === 0);
  }
  if (histBadge) {
    histBadge.textContent = App.history.length;
    histBadge.classList.toggle('hidden', App.history.length === 0);
  }
}

/* ============================================================
   HISTORY
   ============================================================ */
function saveHistory(formula, inputs, result) {
  const entry = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,8),
    formulaId: formula.id,
    formulaName: formula.name,
    inputs: JSON.parse(JSON.stringify(inputs)),
    result: JSON.parse(JSON.stringify(result)),
    timestamp: Date.now()
  };
  App.history.unshift(entry);
  if (App.history.length > 50) App.history.pop();
  Storage.set('efc_history', App.history);
  updateBadges();
}

function showHistory() {
  const modal = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  const footer = document.getElementById('modalFooter');

  title.textContent = 'Calculation History';
  if (App.history.length === 0) {
    body.innerHTML = '<div class="empty-state"><h3>No history yet</h3><p>Your calculations will appear here.</p></div>';
    footer.innerHTML = '';
  } else {
    body.innerHTML = App.history.map(h => `
      <div class="history-item" data-history="${h.id}">
        <div class="history-item-info">
          <div class="history-item-name">${escapeHtml(h.formulaName)}</div>
          <div class="history-item-detail">${new Date(h.timestamp).toLocaleString()}</div>
        </div>
        <button class="history-item-del" data-del="${h.id}" title="Delete" aria-label="Delete history item">&times;</button>
      </div>
    `).join('');
    footer.innerHTML = `<button class="btn btn-secondary btn-sm" id="clearHistoryBtn">Clear All</button>`;
  }

  modal.classList.add('open');

  // Bind history item clicks
  body.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.history-item-del')) return;
      const id = el.dataset.history;
      const entry = App.history.find(h => h.id === id);
      if (entry) {
        modal.classList.remove('open');
        openFormula(entry.formulaId);
        // Restore inputs after render
        setTimeout(() => {
          const f = FORMULAS.find(x => x.id === entry.formulaId);
          if (f) {
            f.inputs.forEach(inp => {
              const v = entry.inputs[inp.id];
              if (v === undefined) return;
              const el = document.getElementById(`inp_${inp.id}`);
              if (el) {
                if (inp.unitType === 'select') {
                  el.value = v;
                } else if (inp.unitType === 'text') {
                  el.value = v;
                } else {
                  // Convert back from base to display unit
                  const unit = App.unitValues[inp.id] || inp.defaultUnit;
                  const displayVal = fromBase(v, unit, inp.unitType);
                  el.value = displayVal;
                }
              }
            });
            calculate();
          }
        }, 50);
      }
    });
  });

  // Delete buttons
  body.querySelectorAll('.history-item-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.del;
      App.history = App.history.filter(h => h.id !== id);
      Storage.set('efc_history', App.history);
      updateBadges();
      showHistory();
    });
  });

  // Clear all
  const clearBtn = document.getElementById('clearHistoryBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      App.history = [];
      Storage.set('efc_history', App.history);
      updateBadges();
      showHistory();
    });
  }
}

/* ============================================================
   FAVORITES VIEW
   ============================================================ */
function showFavorites() {
  const modal = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  const footer = document.getElementById('modalFooter');

  title.textContent = 'Favorites';
  const favFormulas = FORMULAS.filter(f => App.favorites.includes(f.id));
  if (favFormulas.length === 0) {
    body.innerHTML = '<div class="empty-state"><h3>No favorites yet</h3><p>Click the star icon on any formula card to save it here.</p></div>';
  } else {
    body.innerHTML = favFormulas.map(f => `
      <div class="history-item" data-fav-formula="${f.id}">
        <div class="history-item-info">
          <div class="history-item-name">${escapeHtml(f.name)}</div>
          <div class="history-item-detail">${escapeHtml(f.eq)}</div>
        </div>
        <button class="history-item-del" data-remove-fav="${f.id}" title="Remove" aria-label="Remove from favorites">&times;</button>
      </div>
    `).join('');
  }
  footer.innerHTML = '';

  modal.classList.add('open');

  body.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.history-item-del')) return;
      modal.classList.remove('open');
      openFormula(el.dataset.favFormula);
    });
  });

  body.querySelectorAll('.history-item-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.removeFav);
      showFavorites();
    });
  });
}

/* ============================================================
   SEARCH
   ============================================================ */
function performSearch(query) {
  App.searchQuery = query.trim().toLowerCase();
  if (!App.searchQuery) {
    renderCategory(App.currentCategory);
    return;
  }

  App.currentView = 'search';
  document.getElementById('categoryView').classList.add('hidden');
  document.getElementById('calcView').classList.add('hidden');
  document.getElementById('favView').classList.add('hidden');
  document.getElementById('historyView').classList.add('hidden');
  document.getElementById('searchView').classList.remove('hidden');

  const q = App.searchQuery;
  const results = FORMULAS.filter(f => {
    const cat = CATEGORIES.find(c => c.id === f.cat);
    const searchText = [
      f.name, f.desc, f.eq, cat ? cat.name : '',
      ...f.inputs.map(i => i.label + ' ' + i.id),
      ...f.outputs.map(o => o.label + ' ' + o.id)
    ].join(' ').toLowerCase();
    return searchText.includes(q);
  });

  const el = document.getElementById('searchView');
  if (results.length === 0) {
    el.innerHTML = `<div class="empty-state">
      ${Icons.search}
      <h3>No results found</h3>
      <p>No formulas match "${escapeHtml(query)}". Try a different term or browse categories.</p>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="category-header">
    <h2>Search Results</h2>
    <p>${results.length} formula${results.length !== 1 ? 's' : ''} found for "${escapeHtml(query)}"</p>
  </div>
  <div class="formula-grid">
    ${results.map(f => formulaCardHTML(f)).join('')}
  </div>`;
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindEvents() {
  // Sidebar clicks
  document.getElementById('sidebarCats').addEventListener('click', (e) => {
    const item = e.target.closest('.cat-item');
    if (item) renderCategory(item.dataset.cat);
  });

  // Mobile chips
  document.getElementById('mobileCats').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) renderCategory(chip.dataset.cat);
  });

  // Formula grid clicks (delegated)
  document.getElementById('formulaGrid').addEventListener('click', (e) => {
    const favBtn = e.target.closest('.formula-card-fav');
    if (favBtn) {
      e.stopPropagation();
      toggleFavorite(favBtn.dataset.fav);
      return;
    }
    const card = e.target.closest('.formula-card');
    if (card) openFormula(card.dataset.formula);
  });

  // Search view clicks (delegated)
  document.getElementById('searchView').addEventListener('click', (e) => {
    const favBtn = e.target.closest('.formula-card-fav');
    if (favBtn) {
      e.stopPropagation();
      toggleFavorite(favBtn.dataset.fav);
      return;
    }
    const card = e.target.closest('.formula-card');
    if (card) openFormula(card.dataset.formula);
  });

  // Global search
  const searchInput = document.getElementById('globalSearch');
  let searchTimeout;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      performSearch(e.target.value);
    }, 200);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      performSearch('');
    }
  });

  // Theme toggle
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  // Favorites button
  document.getElementById('favoritesBtn').addEventListener('click', showFavorites);

  // History button
  document.getElementById('historyBtn').addEventListener('click', showHistory);

  // Clear all
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (confirm('Clear all history and favorites? This cannot be undone.')) {
      App.favorites = [];
      App.history = [];
      Storage.set('efc_favorites', []);
      Storage.set('efc_history', []);
      updateBadges();
      renderCategory(App.currentCategory);
      toast('All data cleared.', 'success');
    }
  });

  // Modal close
  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) {
      e.currentTarget.classList.remove('open');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  });

  // Keyboard navigation for formula cards
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement.classList.contains('formula-card')) {
      openFormula(document.activeElement.dataset.formula);
    }
  });
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => {
    el.classList.remove('show');
  }, 2500);
}

/* ============================================================
   GO HOME
   ============================================================ */
App.goHome = function() {
  document.getElementById('globalSearch').value = '';
  renderCategory(App.currentCategory || 'math');
};

/* ============================================================
   START
   ============================================================ */
document.addEventListener('DOMContentLoaded', init);
</script>
