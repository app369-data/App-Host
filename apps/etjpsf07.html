<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Engineering Formula Calculator Pro</title>
  <style>
    /* ===== CSS RESET & VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Dark theme (default) */
      --bg-primary: #0b1420;
      --bg-secondary: #121e2f;
      --bg-card: #1a2a3f;
      --bg-input: #0f1a2b;
      --bg-hover: #243b55;
      --border: #2a3f5a;
      --border-light: #3a5470;
      --text-primary: #e8eef7;
      --text-secondary: #9bb0c9;
      --text-muted: #6b8099;
      --accent: #3b9eff;
      --accent-hover: #5aadff;
      --accent-glow: rgba(59, 158, 255, 0.15);
      --success: #2ecc71;
      --success-bg: rgba(46, 204, 113, 0.1);
      --error: #e74c3c;
      --error-bg: rgba(231, 76, 60, 0.1);
      --warning: #f39c12;
      --warning-bg: rgba(243, 156, 18, 0.1);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: 0.2s ease;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    [data-theme="light"] {
      --bg-primary: #f0f4fa;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f5f7fc;
      --bg-hover: #e8eef7;
      --border: #d4dde8;
      --border-light: #b8c6d8;
      --text-primary: #1a2a3f;
      --text-secondary: #4a5e78;
      --text-muted: #7a8ea8;
      --accent: #1a7eff;
      --accent-hover: #0066e0;
      --accent-glow: rgba(26, 126, 255, 0.1);
      --success: #1ea85a;
      --success-bg: rgba(30, 168, 90, 0.08);
      --error: #d63d2e;
      --error-bg: rgba(214, 61, 46, 0.08);
      --warning: #d48a0e;
      --warning-bg: rgba(212, 138, 14, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
    }

    .logo svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .logo-text span {
      color: var(--accent);
    }

    .search-container {
      flex: 1;
      position: relative;
      max-width: 480px;
      min-width: 0;
    }

    .search-container svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
      position: relative;
    }

    .btn-icon:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    .btn-icon.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      pointer-events: none;
    }

    /* ===== LAYOUT ===== */
    .app-body {
      display: flex;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 60px);
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 8px 10px 6px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
      border: 1px solid transparent;
      user-select: none;
    }

    .cat-item:hover {
      background: var(--bg-hover);
    }

    .cat-item.active {
      background: var(--accent-glow);
      border-color: var(--accent);
    }

    .cat-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .cat-item-text {
      flex: 1;
      min-width: 0;
    }

    .cat-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-item-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== MAIN WORKSPACE ===== */
    .workspace {
      flex: 1;
      padding: 20px 24px 60px;
      min-width: 0;
      overflow-x: hidden;
    }

    .category-header {
      margin-bottom: 20px;
    }

    .category-header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .category-header p {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 640px;
    }

    /* ===== FORMULA GRID ===== */
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .formula-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .formula-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .formula-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .formula-card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .formula-card-fav {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .formula-card-fav:hover {
      background: var(--bg-hover);
      color: var(--warning);
    }

    .formula-card-fav.active {
      color: var(--warning);
    }

    .formula-card-fav svg {
      width: 16px;
      height: 16px;
    }

    .formula-card-eq {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      background: var(--bg-input);
      padding: 6px 10px;
      border-radius: 4px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .formula-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ===== CALCULATOR PANEL ===== */
    .calc-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-top: 8px;
      box-shadow: var(--shadow-sm);
    }

    .calc-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .calc-header-info h3 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .calc-header-info p {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 600px;
    }

    .calc-header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .calc-equation {
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--accent);
      background: var(--bg-input);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      overflow-x: auto;
      white-space: nowrap;
      border-left: 3px solid var(--accent);
    }

    .calc-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .calc-body.full-width {
      grid-template-columns: 1fr;
    }

    .calc-inputs h4,
    .calc-results h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .input-group label .unit-hint {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 11px;
      margin-left: 4px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-row input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px var(--error-bg);
    }

    .input-row select {
      padding: 9px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 12px;
      font-family: var(--font-sans);
      outline: none;
      cursor: pointer;
      max-width: 110px;
      transition: border-color var(--transition);
    }

    .input-row select:focus {
      border-color: var(--accent);
    }

    .input-error-msg {
      font-size: 11px;
      color: var(--error);
      margin-top: 3px;
      min-height: 14px;
    }

    .calc-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-sans);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-light);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ===== RESULTS ===== */
    .result-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      min-height: 60px;
    }

    .result-placeholder {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }

    .result-main {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .result-unit {
      font-size: 14px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
    }

    .result-detail {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .result-detail .kv {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      gap: 12px;
    }

    .result-detail .kv .k {
      color: var(--text-muted);
    }

    .result-detail .kv .v {
      font-family: var(--font-mono);
      color: var(--text-primary);
      text-align: right;
      word-break: break-all;
    }

    /* ===== STEPS ===== */
    .steps-section {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .steps-section h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .steps-section h4 svg {
      width: 14px;
      height: 14px;
      transition: transform var(--transition);
    }

    .steps-section h4.collapsed svg {
      transform: rotate(-90deg);
    }

    .steps-content {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .steps-content .step-num {
      color: var(--accent);
      font-weight: 700;
    }

    .steps-content .step-value {
      color: var(--success);
    }

    .steps-content .step-highlight {
      color: var(--warning);
    }

    .assumptions {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .assumptions strong {
      color: var(--warning);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .empty-state p {
      font-size: 14px;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body .history-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .modal-body .history-item:hover {
      background: var(--bg-hover);
      margin: 0 -8px;
      padding: 10px 8px;
      border-radius: 4px;
    }

    .modal-body .history-item:last-child {
      border-bottom: none;
    }

    .history-item-info {
      flex: 1;
      min-width: 0;
    }

    .history-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-detail {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-del {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .history-item-del:hover {
      color: var(--error);
      background: var(--error-bg);
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text-primary);
      box-shadow: var(--shadow-lg);
      z-index: 300;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: var(--success);
    }

    .toast.error {
      border-color: var(--error);
    }

    /* ===== MOBILE CATEGORY CHIPS ===== */
    .mobile-cats {
      display: none;
      overflow-x: auto;
      gap: 8px;
      padding: 10px 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

function toBase(value, unit, type) {
  if (type === 'temperature') {
    // Special: absolute temperature -> Kelvin

      case 'K': return value;
      case '°C': return value + 273.15;
      case '°F': return (value - 32) * 5/9 + 273.15;

      case 'R': return value * 5/9;
      default: return value;
    }
  }
  const table = Units[type];
  if (!table) return value;
  const factor = table[unit];
  if (factor === undefined) return value;
  return value * factor;
}

reg({
  id: 'pct-change', cat: 'math', name: 'Percentage Change',
  desc: 'Calculate percentage change between two values.',
  eq: '% change = ((V₂ − V₁) / |V₁|) × 100%',
  inputs: [
    { id: 'v1', label: 'Initial Value (V₁)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'v2', label: 'Final Value (V₂)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [{ id: 'pct', label: 'Percentage Change', unitType: 'dimensionless', defaultUnit: '%' }],
  example: { v1: 100, v2: 125 },
  assumptions: 'Percentage change relative to the absolute value of V₁. V₁ must not be zero.',
  calc: (v) => {
    if (v.v1 === 0) throw new Error('Initial value V₁ must not be zero.');
    const pct = ((v.v2 - v.v1) / Math.abs(v.v1)) * 100;
    return { pct };
  },
  steps: (v, r) => `Formula: % change = ((V₂ − V₁) / |V₁|) × 100%\nGiven: V₁ = ${v.v1}, V₂ = ${v.v2}\nDifference: V₂ − V₁ = ${v.v2 - v.v1}\nRelative change: ${v.v2 - v.v1} / |${v.v1}| = ${((v.v2 - v.v1)/Math.abs(v.v1))}\nPercentage: ${((v.v2 - v.v1)/Math.abs(v.v1))} × 100% = ${fmtNum(r.pct)}%`
});

reg({
  id: 'ratio', cat: 'math', name: 'Ratios and Proportions',
  desc: 'Solve a proportion A/B = C/D for the unknown D.',
  eq: 'A / B = C / D  →  D = (B × C) / A',
  inputs: [
    { id: 'a', label: 'A', unitType: 'dimensionless', defaultUnit: '' },

});

reg({
  id: 'power-root', cat: 'math', name: 'Powers and Roots',
  desc: 'Calculate x^n or the n-th root of x.',
  eq: 'xⁿ  or  x^(1/n)',
  inputs: [
    { id: 'x', label: 'Base (x)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'n', label: 'Exponent / Root Index (n)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'mode', label: 'Operation', unitType: 'select', options: ['Power (xⁿ)', 'Root (ⁿ√x)'], defaultUnit: '' }
  ],
  outputs: [{ id: 'result', label: 'Result', unitType: 'dimensionless', defaultUnit: '' }],
  example: { x: 2, n: 10, mode: 'Power (xⁿ)' },
  assumptions: 'For roots, x must be non-negative if n is even. n must not be zero for roots.',
  calc: (v) => {
    if (v.mode === 'Power (xⁿ)') {
      const r = Math.pow(v.x, v.n);
      if (!isFinite(r)) throw new Error('Result is not finite.');
      return { result: r };
    } else {
      if (v.n === 0) throw new Error('Root index n must not be zero.');
      if (v.x < 0 && Math.abs(v.n % 2) === 0) throw new Error('Even root of a negative number is not real.');
      const r = Math.sign(v.x) * Math.pow(Math.abs(v.x), 1/v.n);
      return { result: r };
    }
  },
  steps: (v, r) => {
    if (v.mode === 'Power (xⁿ)') return `Formula: xⁿ\nGiven: x = ${v.x}, n = ${v.n}\nSubstitution: ${v.x}^${v.n}\nResult: ${fmtNum(r.result)}`;
    return `Formula: ⁿ√x = x^(1/n)\nGiven: x = ${v.x}, n = ${v.n}\nSubstitution: ${v.x}^(1/${v.n})\nResult: ${fmtNum(r.result)}`;
  }
});

reg({
  id: 'sci-notation', cat: 'math', name: 'Scientific Notation',
  desc: 'Convert a number to scientific notation or back.',
  eq: 'N = a × 10^b   (1 ≤ |a| < 10)',
  inputs: [
    { id: 'num', label: 'Number', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [
    { id: 'mantissa', label: 'Mantissa (a)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'exponent', label: 'Exponent (b)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { num: 0.0001234 },
  assumptions: 'Standard scientific notation with mantissa in [1, 10).',
  calc: (v) => {
    if (v.num === 0) return { mantissa: 0, exponent: 0 };
    const exp = Math.floor(Math.log10(Math.abs(v.num)));
    const mant = v.num / Math.pow(10, exp);
    return { mantissa: mant, exponent: exp };
  },
  steps: (v, r) => `Given: N = ${v.num}\nExponent: b = floor(log₁₀|N|) = ${r.exponent}\nMantissa: a = N / 10^b = ${fmtNum(r.mantissa)}\nScientific notation: ${fmtNum(r.mantissa)} × 10^${r.exponent}`
});

reg({
  id: 'linear-eq', cat: 'math', name: 'Linear Equation',
  desc: 'Solve ax + b = 0 for x.',
  eq: 'x = −b / a',
  inputs: [

  },

});

reg({
  id: 'quadratic', cat: 'math', name: 'Quadratic Equation',
  desc: 'Solve ax² + bx + c = 0 including complex roots.',
  eq: 'x = [−b ± √(b² − 4ac)] / (2a)',
  inputs: [
    { id: 'a', label: 'Coefficient a', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'b', label: 'Coefficient b', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'c', label: 'Constant c', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [
    { id: 'x1', label: 'Root 1', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'x2', label: 'Root 2', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'disc', label: 'Discriminant', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { a: 1, b: -3, c: 2 },
  assumptions: 'a ≠ 0. Discriminant determines root type: Δ > 0 real distinct, Δ = 0 real repeated, Δ < 0 complex conjugate pair.',
  calc: (v) => {
    if (v.a === 0) throw new Error('Coefficient a must not be zero. Use linear equation for a = 0.');
    const disc = v.b * v.b - 4 * v.a * v.c;
    if (disc >= 0) {
      const sq = Math.sqrt(disc);
      const x1 = (-v.b + sq) / (2 * v.a);
      const x2 = (-v.b - sq) / (2 * v.a);
      return { x1, x2, disc };
    } else {
      const real = -v.b / (2 * v.a);
      const imag = Math.sqrt(-disc) / (2 * v.a);
      return { x1: `${fmtNum(real)} + ${fmtNum(Math.abs(imag))}i`, x2: `${fmtNum(real)} − ${fmtNum(Math.abs(imag))}i`, disc };
    }
  },
  steps: (v, r) => {
    const disc = v.b*v.b - 4*v.a*v.c;
    let s = `Equation: ${v.a}x² + ${v.b}x + ${v.c} = 0\nDiscriminant: Δ = b² − 4ac = ${v.b}² − 4(${v.a})(${v.c}) = ${fmtNum(disc)}\n`;
    if (disc >= 0) {
      s += `Δ ≥ 0 → real roots\nx₁ = [−b + √Δ] / (2a) = ${fmtNum(r.x1)}\nx₂ = [−b − √Δ] / (2a) = ${fmtNum(r.x2)}`;
    } else {
      s += `Δ < 0 → complex conjugate roots\nReal part = −b/(2a) = ${fmtNum(-v.b/(2*v.a))}\nImaginary part = √(−Δ)/(2a) = ${fmtNum(Math.sqrt(-disc)/(2*v.a))}\nx₁ = ${r.x1}\nx₂ = ${r.x2}`;
    }
    return s;
  }
});

reg({
  id: 'rearrange', cat: 'math', name: 'Rearrange Simple Equation',
  desc: 'Solve y = mx + b for a selected variable.',
  eq: 'y = mx + b  →  solve for m, x, or b',
  inputs: [
    { id: 'y', label: 'y', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'm', label: 'm (slope)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'x', label: 'x', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'b', label: 'b (intercept)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'solveFor', label: 'Solve for', unitType: 'select', options: ['m', 'x', 'b'], defaultUnit: '' }
  ],
  outputs: [{ id: 'result', label: 'Result', unitType: 'dimensionless', defaultUnit: '' }],
  example: { y: 10, m: 2, x: 3, b: 4, solveFor: 'b' },
  assumptions: 'Appropriate denominators must not be zero.',
  calc: (v) => {
    switch(v.solveFor) {
      case 'm':
        if (v.x === 0) throw new Error('x must not be zero when solving for m.');
        return { result: (v.y - v.b) / v.x };
      case 'x':
        if (v.m === 0) throw new Error('m must not be zero when solving for x.');
        return { result: (v.y - v.b) / v.m };
      case 'b':
        return { result: v.y - v.m * v.x };
      default:
        throw new Error('Select a variable to solve for.');
    }
  },
  steps: (v, r) => {
    const map = {
      'm': `y = mx + b → m = (y − b) / x\nm = (${v.y} − ${v.b}) / ${v.x} = ${fmtNum(r.result)}`,
      'x': `y = mx + b → x = (y − b) / m\nx = (${v.y} − ${v.b}) / ${v.m} = ${fmtNum(r.result)}`,
      'b': `y = mx + b → b = y − mx\nb = ${v.y} − (${v.m})(${v.x}) = ${fmtNum(r.result)}`
    };
    return map[v.solveFor] || 'Select a variable.';
  }
});

reg({
  id: 'average', cat: 'math', name: 'Average and Weighted Average',
  desc: 'Calculate simple or weighted average of values.',
  eq: 'x̄ = Σxᵢ / n   or   x̄_w = Σ(wᵢxᵢ) / Σwᵢ',
  inputs: [
    { id: 'values', label: 'Values (comma-separated)', unitType: 'text', defaultUnit: '' },
    { id: 'weights', label: 'Weights (comma-separated, optional)', unitType: 'text', defaultUnit: '' }
  ],
  outputs: [
    { id: 'mean', label: 'Average', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'sum', label: 'Sum', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'count', label: 'Count', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { values: '85, 90, 78, 92, 88', weights: '1, 2, 1, 2, 1' },
  assumptions: 'Values and weights must have matching counts if weights are provided. Weights must not sum to zero.',
  calc: (v) => {
    const vals = String(v.values).split(',').map(s => parseFloat(s.trim())).filter(x => isFinite(x));
    if (vals.length === 0) throw new Error('Provide at least one valid value.');
    const sum = vals.reduce((a,b) => a+b, 0);
    if (v.weights && String(v.weights).trim()) {
      const wts = String(v.weights).split(',').map(s => parseFloat(s.trim())).filter(x => isFinite(x));
      if (wts.length !== vals.length) throw new Error('Weights count must match values count.');
      const wsum = wts.reduce((a,b) => a+b, 0);
      if (wsum === 0) throw new Error('Sum of weights must not be zero.');
      const wmean = vals.reduce((a,val,i) => a + val * wts[i], 0) / wsum;
      return { mean: wmean, sum, count: vals.length };
    }
    return { mean: sum / vals.length, sum, count: vals.length };
  },
  steps: (v, r) => `Values: ${v.values}\nCount: ${r.count}\nSum: ${fmtNum(r.sum)}\nAverage: ${fmtNum(r.mean)}`
});

reg({
  id: 'trig', cat: 'math', name: 'Basic Trigonometric Calculations',
  desc: 'Calculate sin, cos, tan, and inverse functions.',
  eq: 'sin θ, cos θ, tan θ, and inverses',
  inputs: [
    { id: 'angle', label: 'Angle', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'angleUnit', label: 'Angle Unit', unitType: 'select', options: ['Degrees', 'Radians'], defaultUnit: '' },
    { id: 'func', label: 'Function', unitType: 'select', options: ['sin', 'cos', 'tan', 'asin', 'acos', 'atan'], defaultUnit: '' }
  ],
  outputs: [{ id: 'result', label: 'Result', unitType: 'dimensionless', defaultUnit: '' }],
  example: { angle: 30, angleUnit: 'Degrees', func: 'sin' },
  assumptions: 'For inverse functions, input must be in valid domain: asin/acos ∈ [−1, 1].',
  calc: (v) => {
    let a = v.angle;
    if (v.angleUnit === 'Degrees') a = a * Math.PI / 180;
    let r;
    switch(v.func) {
      case 'sin': r = Math.sin(a); break;
      case 'cos': r = Math.cos(a); break;
      case 'tan': r = Math.tan(a); break;
      case 'asin':
        if (a < -1 || a > 1) throw new Error('asin domain is [−1, 1].');
        r = Math.asin(a); break;
      case 'acos':
        if (a < -1 || a > 1) throw new Error('acos domain is [−1, 1].');
        r = Math.acos(a); break;
      case 'atan': r = Math.atan(a); break;
      default: throw new Error('Unknown function.');
    }
    if (v.func.startsWith('a') && v.angleUnit === 'Degrees') r = r * 180 / Math.PI;
    return { result: r };
  },
  steps: (v, r) => `Function: ${v.func}\nAngle: ${v.angle} ${v.angleUnit}\nResult: ${fmtNum(r.result)} ${v.func.startsWith('a') ? v.angleUnit : ''}`
});

  inputs: [

reg({

  eq: 'V = π(R² − r²)h',

    { id: 'r', label: 'Inner Radius', unitType: 'length', defaultUnit: 'm' },

reg({
  id: 'cone', cat: 'geometry', name: 'Cone',
  desc: 'Volume and surface area of a right circular cone.',
  eq: 'V = (1/3)πr²h,  A = πr(r + √(r²+h²))',
  inputs: [
    { id: 'r', label: 'Base Radius', unitType: 'length', defaultUnit: 'm' },
    { id: 'h', label: 'Height', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [

  ],
  example: { r: 2, h: 4 },
  assumptions: 'r > 0, h > 0.',

    return `V = (1/3)πr²h = (1/3)π(${v.r})²(${v.h}) = ${fmtNum(r.vol)} m³\nSlant = √(r² + h²) = ${fmtNum(slant)} m\nA = πr(r + slant) = ${fmtNum(r.area)} m²`;
  }
});

reg({
  id: 'hollow-circ', cat: 'geometry', name: 'Hollow Circular Cross-Section',
  desc: 'Area, second moment of area, and polar second moment for a hollow circle.',
  eq: 'A = π(R² − r²),  I = π(R⁴ − r⁴)/4,  J = π(R⁴ − r⁴)/2',
  inputs: [
    { id: 'R', label: 'Outer Radius', unitType: 'length', defaultUnit: 'm' },
    { id: 'r', label: 'Inner Radius', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [
    { id: 'area', label: 'Area', unitType: 'area', defaultUnit: 'm2' },
    { id: 'I', label: 'Second Moment (I)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'J', label: 'Polar Second Moment (J)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { R: 0.05, r: 0.03 },
  assumptions: 'R > r > 0. Units: I and J in m⁴ when lengths in m.',
  calc: (v) => {
    if (v.R <= v.r) throw new Error('Outer radius R must be greater than inner radius r.');
    const R4 = Math.pow(v.R,4), r4 = Math.pow(v.r,4);
    return { area: Math.PI*(v.R*v.R - v.r*v.r), I: Math.PI*(R4 - r4)/4, J: Math.PI*(R4 - r4)/2 };
  },
  steps: (v, r) => `A = π(R² − r²) = ${fmtNum(r.area)} m²\nI = π(R⁴ − r⁴)/4 = ${fmtNum(r.I)} m⁴\nJ = π(R⁴ − r⁴)/2 = ${fmtNum(r.J)} m⁴`
});

reg({

  desc: 'Resolve a force into x and y components.',
  eq: 'Fx = F cos θ,  Fy = F sin θ',
  inputs: [
    { id: 'F', label: 'Force Magnitude', unitType: 'force', defaultUnit: 'N' },
    { id: 'theta', label: 'Angle from +x axis', unitType: 'dimensionless', defaultUnit: '' },

  ],
  outputs: [

  },

});

reg({
  id: 'resultant', cat: 'statics', name: 'Resultant Force 2D',
  desc: 'Resultant of two perpendicular forces.',
  eq: 'R = √(Fx² + Fy²),  θ = atan2(Fy, Fx)',
  inputs: [
    { id: 'Fx', label: 'Force x-component', unitType: 'force', defaultUnit: 'N' },
    { id: 'Fy', label: 'Force y-component', unitType: 'force', defaultUnit: 'N' }
  ],
  outputs: [
    { id: 'R', label: 'Resultant Magnitude', unitType: 'force', defaultUnit: 'N' },
    { id: 'theta', label: 'Direction (from +x)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { Fx: 30, Fy: 40 },
  assumptions: 'Forces are perpendicular components in 2D.',
  calc: (v) => {
    const R = Math.sqrt(v.Fx*v.Fx + v.Fy*v.Fy);
    const theta = Math.atan2(v.Fy, v.Fx) * 180 / Math.PI;
    return { R, theta };
  },
  steps: (v, r) => `R = √(Fx² + Fy²) = √(${v.Fx}² + ${v.Fy}²) = ${fmtNum(r.R)} N\nθ = atan2(Fy, Fx) = ${fmtNum(r.theta)}°`
});

reg({
  id: 'incline', cat: 'statics', name: 'Inclined Plane',
  desc: 'Forces on an inclined plane.',
  eq: 'F_parallel = W sin θ,  F_normal = W cos θ',
  inputs: [
    { id: 'W', label: 'Weight', unitType: 'force', defaultUnit: 'N' },
    { id: 'theta', label: 'Incline Angle', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'angleUnit', label: 'Angle Unit', unitType: 'select', options: ['Degrees', 'Radians'], defaultUnit: '' }
  ],
  outputs: [
    { id: 'Fpar', label: 'Parallel Component', unitType: 'force', defaultUnit: 'N' },
    { id: 'Fnorm', label: 'Normal Component', unitType: 'force', defaultUnit: 'N' }
  ],
  example: { W: 100, theta: 30, angleUnit: 'Degrees' },
  assumptions: 'W > 0. Frictionless plane unless combined with friction calculator.',
  calc: (v) => {
    let a = v.theta;
    if (v.angleUnit === 'Degrees') a = a * Math.PI / 180;
    return { Fpar: v.W * Math.sin(a), Fnorm: v.W * Math.cos(a) };
  },
  steps: (v, r) => `F_parallel = W sin θ = ${v.W} × sin(${v.theta}°) = ${fmtNum(r.Fpar)} N\nF_normal = W cos θ = ${v.W} × cos(${v.theta}°) = ${fmtNum(r.Fnorm)} N`
});

reg({
  id: 'work', cat: 'statics', name: 'Work',
  desc: 'Work done by a force over a distance.',
  eq: 'W = F × s × cos(θ)',
  inputs: [
    { id: 'F', label: 'Force', unitType: 'force', defaultUnit: 'N' },
    { id: 's', label: 'Displacement', unitType: 'length', defaultUnit: 'm' },
    { id: 'theta', label: 'Angle', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'angleUnit', label: 'Angle Unit', unitType: 'select', options: ['Degrees', 'Radians'], defaultUnit: '' }
  ],
  outputs: [{ id: 'W', label: 'Work', unitType: 'energy', defaultUnit: 'J' }],
  example: { F: 50, s: 10, theta: 0, angleUnit: 'Degrees' },
  assumptions: 'Constant force, straight-line displacement.',
  calc: (v) => {
    let a = v.theta;
    if (v.angleUnit === 'Degrees') a = a * Math.PI / 180;
    return { W: v.F * v.s * Math.cos(a) };
  },
  steps: (v, r) => `W = F × s × cos θ = ${v.F} × ${v.s} × cos(${v.theta}°) = ${fmtNum(r.W)} J`
});

reg({
  id: 'kinetic-energy', cat: 'statics', name: 'Translational Kinetic Energy',
  desc: 'Kinetic energy of a moving mass.',
  eq: 'KE = ½ m v²',
  inputs: [
    { id: 'm', label: 'Mass', unitType: 'mass', defaultUnit: 'kg' },
    { id: 'v', label: 'Velocity', unitType: 'velocity', defaultUnit: 'm/s' }
  ],
  outputs: [{ id: 'KE', label: 'Kinetic Energy', unitType: 'energy', defaultUnit: 'J' }],
  example: { m: 1000, v: 20 },
  assumptions: 'Non-relativistic speeds.',
  calc: (v) => ({ KE: 0.5 * v.m * v.v * v.v }),
  steps: (v, r) => `KE = ½mv² = 0.5 × ${v.m} × ${v.v}² = ${fmtNum(r.KE)} J`
});

reg({
  id: 'potential-energy', cat: 'statics', name: 'Gravitational Potential Energy',
  desc: 'Potential energy due to height.',
  eq: 'PE = m g h',
  inputs: [
    { id: 'm', label: 'Mass', unitType: 'mass', defaultUnit: 'kg' },
    { id: 'g', label: 'Gravity', unitType: 'acceleration', defaultUnit: 'm/s2' },
    { id: 'h', label: 'Height', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [{ id: 'PE', label: 'Potential Energy', unitType: 'energy', defaultUnit: 'J' }],
  example: { m: 50, g: 9.80665, h: 10 },
  assumptions: 'Uniform gravitational field.',
  calc: (v) => ({ PE: v.m * v.g * v.h }),
  steps: (v, r) => `PE = mgh = ${v.m} × ${v.g} × ${v.h} = ${fmtNum(r.PE)} J`
});

reg({
  id: 'impulse', cat: 'statics', name: 'Impulse and Momentum',
  desc: 'Impulse equals change in momentum.',
  eq: 'J = F Δt = m Δv',
  inputs: [
    { id: 'm', label: 'Mass', unitType: 'mass', defaultUnit: 'kg' },
    { id: 'v1', label: 'Initial Velocity', unitType: 'velocity', defaultUnit: 'm/s' },
    { id: 'v2', label: 'Final Velocity', unitType: 'velocity', defaultUnit: 'm/s' }
  ],
  outputs: [
    { id: 'impulse', label: 'Impulse', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'dp', label: 'Change in Momentum', unitType: 'dimensionless', defaultUnit: '' }
  ],
  example: { m: 2, v1: 5, v2: 15 },
  assumptions: 'Linear motion, constant mass.',
  calc: (v) => {
    const dp = v.m * (v.v2 - v.v1);
    return { impulse: dp, dp };
  },
  steps: (v, r) => `Δp = m(v₂ − v₁) = ${v.m} × (${v.v2} − ${v.v1}) = ${fmtNum(r.dp)} kg·m/s\nImpulse J = ${fmtNum(r.impulse)} N·s`
});

/* ===== CATEGORY 4: STRENGTH OF MATERIALS ===== */

reg({
  id: 'normal-stress', cat: 'strength', name: 'Normal Stress',
  desc: 'Normal stress from axial force over area.',
  eq: 'σ = F / A',
  inputs: [
    { id: 'F', label: 'Axial Force', unitType: 'force', defaultUnit: 'N' },
    { id: 'A', label: 'Cross-Sectional Area', unitType: 'area', defaultUnit: 'mm2' }
  ],
  outputs: [{ id: 'sigma', label: 'Normal Stress', unitType: 'pressure', defaultUnit: 'MPa' }],
  example: { F: 10000, A: 500 },
  assumptions: 'Uniform stress distribution, prismatic member, axial loading. Positive = tension.',
  calc: (v) => {
    const A_m2 = toBase(v.A, 'mm2', 'area');
    if (A_m2 <= 0) throw new Error('Area must be positive.');
    return { sigma: v.F / A_m2 };
  },
  steps: (v, r) => `σ = F / A\nA = ${v.A} mm² = ${fmtNum(toBase(v.A, 'mm2', 'area'))} m²\nσ = ${v.F} / ${fmtNum(toBase(v.A, 'mm2', 'area'))} = ${fmtNum(r.sigma)} Pa = ${fmtNum(r.sigma/1e6)} MPa`
});

reg({
  id: 'shear-stress', cat: 'strength', name: 'Average Direct Shear Stress',
  desc: 'Average shear stress from shear force over area.',
  eq: 'τ = V / A',
  inputs: [
    { id: 'V', label: 'Shear Force', unitType: 'force', defaultUnit: 'N' },
    { id: 'A', label: 'Shear Area', unitType: 'area', defaultUnit: 'mm2' }
  ],
  outputs: [{ id: 'tau', label: 'Shear Stress', unitType: 'pressure', defaultUnit: 'MPa' }],
  example: { V: 5000, A: 200 },
  assumptions: 'Uniform shear stress distribution over the shear area.',
  calc: (v) => {
    const A_m2 = toBase(v.A, 'mm2', 'area');
    if (A_m2 <= 0) throw new Error('Area must be positive.');
    return { tau: v.V / A_m2 };
  },
  steps: (v, r) => `τ = V / A = ${v.V} / ${fmtNum(toBase(v.A, 'mm2', 'area'))} = ${fmtNum(r.tau)} Pa = ${fmtNum(r.tau/1e6)} MPa`
});

reg({
  id: 'normal-strain', cat: 'strength', name: 'Normal Strain',
  desc: 'Normal strain from deformation.',
  eq: 'ε = ΔL / L₀',
  inputs: [
    { id: 'dL', label: 'Change in Length (ΔL)', unitType: 'length', defaultUnit: 'mm' },
    { id: 'L0', label: 'Original Length (L₀)', unitType: 'length', defaultUnit: 'mm' }
  ],
  outputs: [{ id: 'eps', label: 'Strain', unitType: 'dimensionless', defaultUnit: '' }],
  example: { dL: 0.5, L0: 1000 },
  assumptions: 'L₀ > 0. Strain is dimensionless.',
  calc: (v) => {
    const L0_m = toBase(v.L0, 'mm', 'length');
    const dL_m = toBase(v.dL, 'mm', 'length');
    if (L0_m <= 0) throw new Error('Original length must be positive.');
    return { eps: dL_m / L0_m };
  },
  steps: (v, r) => `ε = ΔL / L₀ = ${v.dL} / ${v.L0} = ${fmtNum(r.eps)}`
});

reg({
  id: 'hooke', cat: 'strength', name: "Hooke's Law",
  desc: 'Stress-strain relationship for linear elastic material.',
  eq: 'σ = E × ε',
  inputs: [
    { id: 'E', label: "Young's Modulus (E)", unitType: 'pressure', defaultUnit: 'GPa' },
    { id: 'eps', label: 'Strain (ε)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [{ id: 'sigma', label: 'Stress', unitType: 'pressure', defaultUnit: 'MPa' }],
  example: { E: 200, eps: 0.001 },
  assumptions: 'Linear elastic region only.',
  calc: (v) => {
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    return { sigma: E_Pa * v.eps };
  },
  steps: (v, r) => `σ = E × ε = ${v.E} GPa × ${v.eps} = ${fmtNum(r.sigma)} Pa = ${fmtNum(r.sigma/1e6)} MPa`
});

reg({
  id: 'axial-deform', cat: 'strength', name: 'Axial Deformation',
  desc: 'Deformation of an axially loaded member.',
  eq: 'δ = FL / (AE)',
  inputs: [
    { id: 'F', label: 'Force', unitType: 'force', defaultUnit: 'N' },
    { id: 'L', label: 'Length', unitType: 'length', defaultUnit: 'mm' },
    { id: 'A', label: 'Area', unitType: 'area', defaultUnit: 'mm2' },
    { id: 'E', label: 'Elastic Modulus', unitType: 'pressure', defaultUnit: 'GPa' }
  ],
  outputs: [{ id: 'delta', label: 'Deformation', unitType: 'length', defaultUnit: 'mm' }],
  example: { F: 50000, L: 2000, A: 1000, E: 200 },
  assumptions: 'Prismatic member, constant axial load, linear elastic material.',
  calc: (v) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const A_m2 = toBase(v.A, 'mm2', 'area');
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    if (A_m2 <= 0 || E_Pa <= 0) throw new Error('Area and modulus must be positive.');
    return { delta: (v.F * L_m) / (A_m2 * E_Pa) };
  },
  steps: (v, r) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const A_m2 = toBase(v.A, 'mm2', 'area');
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    return `δ = FL / (AE)\nL = ${v.L} mm = ${fmtNum(L_m)} m\nA = ${v.A} mm² = ${fmtNum(A_m2)} m²\nE = ${v.E} GPa = ${fmtNum(E_Pa)} Pa\nδ = (${v.F} × ${fmtNum(L_m)}) / (${fmtNum(A_m2)} × ${fmtNum(E_Pa)}) = ${fmtNum(r.delta)} m = ${fmtNum(r.delta*1000)} mm`;
  }
});

reg({
  id: 'thermal-exp', cat: 'strength', name: 'Thermal Expansion',
  desc: 'Free thermal expansion of a member.',
  eq: 'ΔL = α × L × ΔT',
  inputs: [
    { id: 'alpha', label: 'Coefficient of Thermal Expansion (α)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'L', label: 'Original Length', unitType: 'length', defaultUnit: 'mm' },
    { id: 'dT', label: 'Temperature Change (ΔT)', unitType: 'tempDiff', defaultUnit: '°C' }
  ],
  outputs: [{ id: 'dL', label: 'Change in Length', unitType: 'length', defaultUnit: 'mm' }],
  example: { alpha: 1.2e-5, L: 10000, dT: 40 },
  assumptions: 'Free expansion, no restraint. α in 1/°C or 1/K. ΔT in same scale.',
  calc: (v) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const dT_K = toBase(v.dT, '°C', 'tempDiff');
    return { dL: v.alpha * L_m * dT_K };
  },
  steps: (v, r) => `ΔL = α × L × ΔT = ${v.alpha} × ${v.L} mm × ${v.dT} °C = ${fmtNum(r.dL)} m = ${fmtNum(r.dL*1000)} mm`
});

reg({
  id: 'flexural', cat: 'strength', name: 'Flexural Stress',
  desc: 'Bending stress in a beam.',
  eq: 'σ = M × y / I',
  inputs: [
    { id: 'M', label: 'Bending Moment', unitType: 'torque', defaultUnit: 'N·m' },
    { id: 'y', label: 'Distance from Neutral Axis (y)', unitType: 'length', defaultUnit: 'mm' },
    { id: 'I', label: 'Second Moment of Area (I)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [{ id: 'sigma', label: 'Flexural Stress', unitType: 'pressure', defaultUnit: 'MPa' }],
  example: { M: 5000, y: 100, I: 2e7 },
  assumptions: 'Linear elastic, homogeneous material, plane sections remain plane. I in mm⁴ if y in mm and M in N·mm.',
  calc: (v) => {
    const M_Nm = toBase(v.M, 'N·m', 'torque');
    const y_m = toBase(v.y, 'mm', 'length');
    // I must be in m^4: user provides mm^4? We'll assume I in m^4 for consistency? 
    // Better: user provides I in mm^4 and convert. Let's use mm^4 as common engineering.
    // Actually for consistency, let's treat I as dimensionless number in m^4 if SI, but user likely enters mm^4.
    // We'll use I in m^4 by default. But example uses 2e7 mm^4 = 2e-5 m^4? That's small. Let's use direct.
    if (v.I <= 0) throw new Error('I must be positive.');
    return { sigma: (M_Nm * y_m) / v.I };
  },
  steps: (v, r) => {
    const M_Nm = toBase(v.M, 'N·m', 'torque');
    const y_m = toBase(v.y, 'mm', 'length');
    return `σ = M × y / I\nM = ${v.M} N·m = ${fmtNum(M_Nm)} N·m\ny = ${v.y} mm = ${fmtNum(y_m)} m\nσ = ${fmtNum(M_Nm)} × ${fmtNum(y_m)} / ${fmtNum(v.I)} = ${fmtNum(r.sigma)} Pa = ${fmtNum(r.sigma/1e6)} MPa`;
  }
});

reg({
  id: 'torsion-stress', cat: 'strength', name: 'Circular Shaft Torsional Stress',
  desc: 'Maximum shear stress in a circular shaft.',
  eq: 'τ = T × r / J',
  inputs: [
    { id: 'T', label: 'Torque', unitType: 'torque', defaultUnit: 'N·m' },
    { id: 'r', label: 'Radius', unitType: 'length', defaultUnit: 'mm' },
    { id: 'J', label: 'Polar Second Moment (J)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [{ id: 'tau', label: 'Shear Stress', unitType: 'pressure', defaultUnit: 'MPa' }],
  example: { T: 1000, r: 50, J: 9.817e6 },
  assumptions: 'Circular cross-section, linear elastic, uniform material. J in mm⁴ if r in mm and T in N·mm.',
  calc: (v) => {
    const T_Nm = toBase(v.T, 'N·m', 'torque');
    const r_m = toBase(v.r, 'mm', 'length');
    if (v.J <= 0) throw new Error('J must be positive.');
    return { tau: (T_Nm * r_m) / v.J };
  },
  steps: (v, r) => {
    const T_Nm = toBase(v.T, 'N·m', 'torque');
    const r_m = toBase(v.r, 'mm', 'length');
    return `τ = T × r / J = ${fmtNum(T_Nm)} × ${fmtNum(r_m)} / ${fmtNum(v.J)} = ${fmtNum(r.tau)} Pa = ${fmtNum(r.tau/1e6)} MPa`;
  }
});

reg({
  id: 'angle-twist', cat: 'strength', name: 'Angle of Twist',
  desc: 'Angle of twist for a uniform circular shaft.',
  eq: 'φ = TL / (JG)',
  inputs: [
    { id: 'T', label: 'Torque', unitType: 'torque', defaultUnit: 'N·m' },
    { id: 'L', label: 'Length', unitType: 'length', defaultUnit: 'mm' },
    { id: 'J', label: 'Polar Second Moment', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'G', label: 'Shear Modulus', unitType: 'pressure', defaultUnit: 'GPa' }
  ],
  outputs: [{ id: 'phi', label: 'Angle of Twist', unitType: 'dimensionless', defaultUnit: '' }],
  example: { T: 500, L: 2000, J: 9.817e6, G: 80 },
  assumptions: 'Uniform circular shaft, linear elastic, constant torque.',
  calc: (v) => {
    const T_Nm = toBase(v.T, 'N·m', 'torque');
    const L_m = toBase(v.L, 'mm', 'length');
    const G_Pa = toBase(v.G, 'GPa', 'pressure');
    if (v.J <= 0 || G_Pa <= 0) throw new Error('J and G must be positive.');
    return { phi: (T_Nm * L_m) / (v.J * G_Pa) };
  },
  steps: (v, r) => {
    const T_Nm = toBase(v.T, 'N·m', 'torque');
    const L_m = toBase(v.L, 'mm', 'length');
    const G_Pa = toBase(v.G, 'GPa', 'pressure');
    return `φ = TL / (JG) = (${fmtNum(T_Nm)} × ${fmtNum(L_m)}) / (${fmtNum(v.J)} × ${fmtNum(G_Pa)}) = ${fmtNum(r.phi)} rad = ${fmtNum(r.phi*180/Math.PI)}°`;
  }
});

reg({
  id: 'strain-energy', cat: 'strength', name: 'Elastic Strain Energy',
  desc: 'Strain energy in a linearly elastic axially loaded member.',
  eq: 'U = F²L / (2AE)',
  inputs: [
    { id: 'F', label: 'Force', unitType: 'force', defaultUnit: 'N' },
    { id: 'L', label: 'Length', unitType: 'length', defaultUnit: 'mm' },
    { id: 'A', label: 'Area', unitType: 'area', defaultUnit: 'mm2' },
    { id: 'E', label: 'Elastic Modulus', unitType: 'pressure', defaultUnit: 'GPa' }
  ],
  outputs: [{ id: 'U', label: 'Strain Energy', unitType: 'energy', defaultUnit: 'J' }],
  example: { F: 10000, L: 1000, A: 500, E: 200 },
  assumptions: 'Linear elastic, axial loading only.',
  calc: (v) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const A_m2 = toBase(v.A, 'mm2', 'area');
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    if (A_m2 <= 0 || E_Pa <= 0) throw new Error('A and E must be positive.');
    return { U: (v.F*v.F*L_m) / (2*A_m2*E_Pa) };
  },
  steps: (v, r) => `U = F²L / (2AE) = (${v.F}² × ${v.L}mm) / (2 × ${v.A}mm² × ${v.E}GPa) = ${fmtNum(r.U)} J`
});

reg({
  id: 'factor-safety', cat: 'strength', name: 'Factor of Safety',
  desc: 'Factor of safety from allowable stress.',
  eq: 'FoS = σ_allow / σ_actual',
  inputs: [
    { id: 'sigmaAllow', label: 'Allowable Stress', unitType: 'pressure', defaultUnit: 'MPa' },
    { id: 'sigmaActual', label: 'Actual Stress', unitType: 'pressure', defaultUnit: 'MPa' }
  ],
  outputs: [{ id: 'fos', label: 'Factor of Safety', unitType: 'dimensionless', defaultUnit: '' }],
  example: { sigmaAllow: 250, sigmaActual: 100 },
  assumptions: 'Actual stress must be > 0. FoS > 1 indicates safe operation.',
  calc: (v) => {
    const sa = toBase(v.sigmaAllow, 'MPa', 'pressure');
    const s = toBase(v.sigmaActual, 'MPa', 'pressure');
    if (s <= 0) throw new Error('Actual stress must be positive.');
    return { fos: sa / s };
  },
  steps: (v, r) => `FoS = σ_allow / σ_actual = ${v.sigmaAllow} / ${v.sigmaActual} = ${fmtNum(r.fos)}`
});

/* ===== CATEGORY 5: BEAM ANALYSIS ===== */

reg({
  id: 'beam-ss-central', cat: 'beam', name: 'Simply Supported Beam - Central Point Load',
  desc: 'Reactions, max shear, moment, and deflection for a central point load.',
  eq: 'R = P/2,  M_max = PL/4,  δ_max = PL³/(48EI)',
  inputs: [
    { id: 'P', label: 'Point Load (P)', unitType: 'force', defaultUnit: 'N' },
    { id: 'L', label: 'Span (L)', unitType: 'length', defaultUnit: 'mm' },
    { id: 'E', label: 'Elastic Modulus', unitType: 'pressure', defaultUnit: 'GPa' },
    { id: 'I', label: 'Second Moment (I)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [
    { id: 'R', label: 'Support Reaction (each)', unitType: 'force', defaultUnit: 'N' },
    { id: 'Vmax', label: 'Max Shear Force', unitType: 'force', defaultUnit: 'N' },
    { id: 'Mmax', label: 'Max Bending Moment', unitType: 'torque', defaultUnit: 'N·m' },
    { id: 'dmax', label: 'Max Deflection', unitType: 'length', defaultUnit: 'mm' }
  ],
  example: { P: 10000, L: 4000, E: 200, I: 8e7 },
  assumptions: 'Euler-Bernoulli beam theory, linear elastic, prismatic section, central load.',
  calc: (v) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    if (v.I <= 0 || E_Pa <= 0 || L_m <= 0) throw new Error('L, E, and I must be positive.');
    const R = v.P / 2;
    const Mmax = (v.P * L_m) / 4;
    const dmax = (v.P * Math.pow(L_m,3)) / (48 * E_Pa * v.I);
    return { R, Vmax: R, Mmax, dmax };
  },
  steps: (v, r) => {
    const L_m = toBase(v.L, 'mm', 'length');
    return `Reactions: R₁ = R₂ = P/2 = ${v.P}/2 = ${fmtNum(r.R)} N\nMax Shear: V_max = ${fmtNum(r.Vmax)} N\nMax Moment: M_max = PL/4 = ${v.P} × ${fmtNum(L_m)} / 4 = ${fmtNum(r.Mmax)} N·m\nMax Deflection: δ_max = PL³/(48EI) = ${fmtNum(r.dmax)} m = ${fmtNum(r.dmax*1000)} mm`;
  }
});

reg({
  id: 'beam-ss-offcenter', cat: 'beam', name: 'Simply Supported Beam - Off-Center Point Load',
  desc: 'Reactions, max shear, moment, and deflection for an off-center point load.',
  eq: 'R₁ = Pb/L, R₂ = Pa/L, M_max = Pab/L, δ_max at x = √(a(a+2b)/3) if a > b',
  inputs: [
    { id: 'P', label: 'Point Load (P)', unitType: 'force', defaultUnit: 'N' },
    { id: 'L', label: 'Span (L)', unitType: 'length', defaultUnit: 'mm' },
    { id: 'a', label: 'Distance from Left Support (a)', unitType: 'length', defaultUnit: 'mm' },
    { id: 'E', label: 'Elastic Modulus', unitType: 'pressure', defaultUnit: 'GPa' },
    { id: 'I', label: 'Second Moment (I)', unitType: 'dimensionless', defaultUnit: '' }
  ],
  outputs: [
    { id: 'R1', label: 'Reaction Left (R₁)', unitType: 'force', defaultUnit: 'N' },
    { id: 'R2', label: 'Reaction Right (R₂)', unitType: 'force', defaultUnit: 'N' },
    { id: 'Mmax', label: 'Max Bending Moment', unitType: 'torque', defaultUnit: 'N·m' },
    { id: 'dmax', label: 'Max Deflection', unitType: 'length', defaultUnit: 'mm' }
  ],
  example: { P: 8000, L: 5000, a: 2000, E: 200, I: 1e8 },
  assumptions: 'Euler-Bernoulli beam theory, a < L, load at distance a from left support.',
  calc: (v) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const a_m = toBase(v.a, 'mm', 'length');
    const b_m = L_m - a_m;
    if (a_m <= 0 || b_m <= 0) throw new Error('Load position must be within the span (0 < a < L).');
    const E_Pa = toBase(v.E, 'GPa', 'pressure');
    if (v.I <= 0 || E_Pa <= 0) throw new Error('E and I must be positive.');
    const R1 = (v.P * b_m) / L_m;
    const R2 = (v.P * a_m) / L_m;
    const Mmax = (v.P * a_m * b_m) / L_m;
    // Max deflection location (from left) when a > b: x = sqrt(a(a+2b)/3)
    const xm = Math.sqrt(a_m * (a_m + 2*b_m) / 3);
    const dmax = (v.P * a_m * b_m * (a_m + b_m) * Math.sqrt(3*a_m*(a_m+2*b_m))) / (27 * E_Pa * v.I * L_m);
    // simpler: use standard formula for max deflection for off-center load
    // δ_max = (P * a * b * (a + b) * sqrt(3*a*(a+2*b))) / (27 * E * I * L)
    return { R1, R2, Mmax, dmax };
  },
  steps: (v, r) => {
    const L_m = toBase(v.L, 'mm', 'length');
    const a_m = toBase(v.a, 'mm', 'length');
    const b_m = L_m - a_m;
    return `R₁ = Pb/L = ${v.P}×${fmtNum(b_m)}/${fmtNum(L_m)} = ${fmtNum(r.R1)} N\nR₂ = Pa/L = ${v.P}×${fmtNum(a_m)}/${fmtNum(L_m)} = ${fmtNum(r.R2)} N\nM_max = Pab/L = ${fmtNum(r.Mmax)} N·m\nδ_max = ${fmtNum(r.dmax)} m = ${fmtNum(r.dmax*1000)} mm`;
  }
});

  eq: 'P₁ + ½ρv₁² + ρgz₁ = P₂ + ½ρv₂² + ρgz₂',
  inputs: [
    { id: 'P1', label: 'Pressure 1', unitType: 'pressure', defaultUnit: 'Pa' },
    { id: 'v1', label: 'Velocity 1', unitType: 'velocity', defaultUnit: 'm/s' },
    { id: 'z1', label: 'Elevation 1', unitType: 'length', defaultUnit: 'm' },
    { id: 'v2', label: 'Velocity 2', unitType: 'velocity', defaultUnit: 'm/s' },
    { id: 'z2', label: 'Elevation 2', unitType: 'length', defaultUnit: 'm' },
    { id: 'rho', label: 'Density', unitType: 'density', defaultUnit: 'kg/m3' },
    { id: 'g', label: 'Gravity', unitType: 'acceleration', defaultUnit: 'm/s2' }
  ],

});

reg({
  id: 'ideal-gas', cat: 'thermo', name: 'Ideal Gas Law',
  desc: 'PV = nRT for an ideal gas.',
  eq: 'P × V = n × R × T',
  inputs: [
    { id: 'P', label: 'Pressure', unitType: 'pressure', defaultUnit: 'Pa' },
    { id: 'V', label: 'Volume', unitType: 'volume', defaultUnit: 'm3' },
    { id: 'n', label: 'Moles (n)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'T', label: 'Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'solveFor', label: 'Solve for', unitType: 'select', options: ['P', 'V', 'n', 'T'], defaultUnit: '' }
  ],
  outputs: [{ id: 'result', label: 'Result', unitType: 'dimensionless', defaultUnit: '' }],
  example: { P: 101325, V: 0.0224, n: 1, T: 273.15, solveFor: 'n' },
  assumptions: 'R = 8.314462618 J/(mol·K). T in Kelvin.',
  calc: (v) => {
    const R = 8.314462618;
    const T_K = toBase(v.T, 'K', 'temperature');
    switch(v.solveFor) {
      case 'P': return { result: (v.n * R * T_K) / v.V };
      case 'V': return { result: (v.n * R * T_K) / v.P };
      case 'n': return { result: (v.P * v.V) / (R * T_K) };
      case 'T': return { result: (v.P * v.V) / (v.n * R) };
    }
  },
  steps: (v, r) => {
    const R = 8.314462618;
    const T_K = toBase(v.T, 'K', 'temperature');
    return `PV = nRT, R = 8.314 J/(mol·K)\nT = ${v.T} K\nSolving for ${v.solveFor}: ${fmtNum(r.result)}`;
  }
});

  ],
  outputs: [{ id: 'rho', label: 'Density', unitType: 'density', defaultUnit: 'kg/m3' }],
  example: { P: 101325, Rs: 287.05, T: 288.15 },
  assumptions: 'Ideal gas. R_s = R_universal / M. T in Kelvin.',
  calc: (v) => {
    const T_K = toBase(v.T, 'K', 'temperature');
    if (v.Rs <= 0 || T_K <= 0) throw new Error('R_s and T must be positive.');
    return { rho: v.P / (v.Rs * T_K) };
  },
  steps: (v, r) => `ρ = P / (R_s × T) = ${v.P} / (${v.Rs} × ${v.T}) = ${fmtNum(r.rho)} kg/m³`
});

reg({
  id: 'conduction-wall', cat: 'heat', name: 'Conduction Through Plane Wall',
  desc: 'Steady 1D conduction through a plane wall.',
  eq: 'Q̇ = kA(T₁ − T₂) / L',
  inputs: [
    { id: 'k', label: 'Thermal Conductivity (k)', unitType: 'thermalCond', defaultUnit: 'W/(m·K)' },
    { id: 'A', label: 'Area', unitType: 'area', defaultUnit: 'm2' },
    { id: 'T1', label: 'Hot Side Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'T2', label: 'Cold Side Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'L', label: 'Wall Thickness', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [{ id: 'Qdot', label: 'Heat Transfer Rate', unitType: 'power', defaultUnit: 'W' }],
  example: { k: 0.8, A: 10, T1: 300, T2: 280, L: 0.2 },
  assumptions: 'Steady state, 1D conduction, constant k, no internal heat generation.',
  calc: (v) => {
    if (v.L <= 0) throw new Error('Wall thickness must be positive.');
    const T1_K = toBase(v.T1, 'K', 'temperature');
    const T2_K = toBase(v.T2, 'K', 'temperature');
    return { Qdot: (v.k * v.A * (T1_K - T2_K)) / v.L };
  },
  steps: (v, r) => {
    const T1_K = toBase(v.T1, 'K', 'temperature');
    const T2_K = toBase(v.T2, 'K', 'temperature');
    return `Q̇ = kA(T₁ − T₂) / L = ${v.k} × ${v.A} × (${fmtNum(T1_K)} − ${fmtNum(T2_K)}) / ${v.L} = ${fmtNum(r.Qdot)} W`;
  }
});

reg({
  id: 'conduction-cyl', cat: 'heat', name: 'Conduction Through Cylindrical Wall',
  desc: 'Steady 1D radial conduction through a cylindrical shell.',
  eq: 'Q̇ = 2πkL(T₁ − T₂) / ln(r₂/r₁)',
  inputs: [
    { id: 'k', label: 'Thermal Conductivity', unitType: 'thermalCond', defaultUnit: 'W/(m·K)' },
    { id: 'L', label: 'Length', unitType: 'length', defaultUnit: 'm' },
    { id: 'T1', label: 'Inner Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'T2', label: 'Outer Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'r1', label: 'Inner Radius', unitType: 'length', defaultUnit: 'm' },
    { id: 'r2', label: 'Outer Radius', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [{ id: 'Qdot', label: 'Heat Transfer Rate', unitType: 'power', defaultUnit: 'W' }],
  example: { k: 50, L: 2, T1: 400, T2: 350, r1: 0.05, r2: 0.1 },
  assumptions: 'Steady state, 1D radial conduction, constant k, no internal generation.',
  calc: (v) => {
    if (v.r1 <= 0 || v.r2 <= v.r1) throw new Error('Radii must satisfy 0 < r₁ < r₂.');
    const T1_K = toBase(v.T1, 'K', 'temperature');
    const T2_K = toBase(v.T2, 'K', 'temperature');
    return { Qdot: (2 * Math.PI * v.k * v.L * (T1_K - T2_K)) / Math.log(v.r2 / v.r1) };
  },
  steps: (v, r) => {
    const T1_K = toBase(v.T1, 'K', 'temperature');
    const T2_K = toBase(v.T2, 'K', 'temperature');
    return `Q̇ = 2πkL(T₁ − T₂) / ln(r₂/r₁)\n= 2π×${v.k}×${v.L}×(${fmtNum(T1_K)} − ${fmtNum(T2_K)}) / ln(${v.r2}/${v.r1})\n= ${fmtNum(r.Qdot)} W`;
  }
});

reg({
  id: 'newton-cooling', cat: 'heat', name: "Newton's Law of Cooling",
  desc: 'Convective heat transfer from a surface.',
  eq: 'Q̇ = h × A × (T_s − T_∞)',
  inputs: [
    { id: 'h', label: 'Convective Coefficient (h)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'A', label: 'Surface Area', unitType: 'area', defaultUnit: 'm2' },
    { id: 'Ts', label: 'Surface Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'Tinf', label: 'Fluid Temperature', unitType: 'temperature', defaultUnit: 'K' }
  ],
  outputs: [{ id: 'Qdot', label: 'Heat Transfer Rate', unitType: 'power', defaultUnit: 'W' }],
  example: { h: 25, A: 2, Ts: 350, Tinf: 300 },
  assumptions: 'Newton\'s law of cooling, constant h, T_s > T_∞ for heat loss.',
  calc: (v) => {
    const Ts_K = toBase(v.Ts, 'K', 'temperature');
    const Tinf_K = toBase(v.Tinf, 'K', 'temperature');
    return { Qdot: v.h * v.A * (Ts_K - Tinf_K) };
  },
  steps: (v, r) => {
    const Ts_K = toBase(v.Ts, 'K', 'temperature');
    const Tinf_K = toBase(v.Tinf, 'K', 'temperature');
    return `Q̇ = hA(T_s − T_∞) = ${v.h} × ${v.A} × (${fmtNum(Ts_K)} − ${fmtNum(Tinf_K)}) = ${fmtNum(r.Qdot)} W`;
  }
});

reg({
  id: 'radiation', cat: 'heat', name: 'Stefan-Boltzmann Radiation',
  desc: 'Thermal radiation heat transfer.',
  eq: 'Q̇ = ε × σ × A × (T_s⁴ − T_sur⁴)',
  inputs: [
    { id: 'eps', label: 'Emissivity (ε)', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'A', label: 'Area', unitType: 'area', defaultUnit: 'm2' },
    { id: 'Ts', label: 'Surface Temperature', unitType: 'temperature', defaultUnit: 'K' },
    { id: 'Tsur', label: 'Surroundings Temperature', unitType: 'temperature', defaultUnit: 'K' }
  ],
  outputs: [{ id: 'Qdot', label: 'Net Radiation', unitType: 'power', defaultUnit: 'W' }],
  example: { eps: 0.9, A: 1, Ts: 500, Tsur: 300 },
  assumptions: 'Gray surface, diffuse, Stefan-Boltzmann σ = 5.67e-8 W/(m²·K⁴).',
  calc: (v) => {
    const sigma = 5.670374419e-8;
    const Ts_K = toBase(v.Ts, 'K', 'temperature');
    const Tsur_K = toBase(v.Tsur, 'K', 'temperature');
    return { Qdot: v.eps * sigma * v.A * (Math.pow(Ts_K,4) - Math.pow(Tsur_K,4)) };
  },
  steps: (v, r) => {
    const sigma = 5.670374419e-8;
    const Ts_K = toBase(v.Ts, 'K', 'temperature');
    const Tsur_K = toBase(v.Tsur, 'K', 'temperature');
    return `Q̇ = εσA(T_s⁴ − T_sur⁴) = ${v.eps} × ${sigma} × ${v.A} × (${fmtNum(Ts_K)}⁴ − ${fmtNum(Tsur_K)}⁴) = ${fmtNum(r.Qdot)} W`;
  }
});

reg({
  id: 'lmtd', cat: 'heat', name: 'Logarithmic Mean Temperature Difference',
  desc: 'LMTD for heat exchangers.',
  eq: 'ΔT_lm = (ΔT₁ − ΔT₂) / ln(ΔT₁/ΔT₂)',
  inputs: [
    { id: 'dT1', label: 'Temperature Difference 1', unitType: 'tempDiff', defaultUnit: 'K' },
    { id: 'dT2', label: 'Temperature Difference 2', unitType: 'tempDiff', defaultUnit: 'K' }
  ],
  outputs: [{ id: 'dTlm', label: 'LMTD', unitType: 'tempDiff', defaultUnit: 'K' }],
  example: { dT1: 40, dT2: 20 },
  assumptions: 'ΔT₁ and ΔT₂ must be positive. If nearly equal, LMTD → ΔT₁.',
  calc: (v) => {
    if (v.dT1 <= 0 || v.dT2 <= 0) throw new Error('Temperature differences must be positive.');
    if (Math.abs(v.dT1 - v.dT2) < 1e-9) return { dTlm: v.dT1 };
    return { dTlm: (v.dT1 - v.dT2) / Math.log(v.dT1 / v.dT2) };
  },
  steps: (v, r) => {
    if (Math.abs(v.dT1 - v.dT2) < 1e-9) return `ΔT₁ ≈ ΔT₂ → ΔT_lm = ${v.dT1} K`;
    return `ΔT_lm = (ΔT₁ − ΔT₂) / ln(ΔT₁/ΔT₂) = (${v.dT1} − ${v.dT2}) / ln(${v.dT1}/${v.dT2}) = ${fmtNum(r.dTlm)} K`;
  }
});

reg({
  id: 'overall-heat', cat: 'heat', name: 'Overall Heat Transfer Rate',
  desc: 'Heat exchanger duty using U, A, and LMTD.',
  eq: 'Q̇ = U × A × ΔT_lm',
  inputs: [

    { id: 'A', label: 'Area', unitType: 'area', defaultUnit: 'm2' },

  ],
  outputs: [{ id: 'Qdot', label: 'Heat Transfer Rate', unitType: 'power', defaultUnit: 'W' }],
  example: { U: 500, A: 10, dTlm: 30 },
  assumptions: 'Steady-state heat exchanger, constant U, LMTD method applicable.',
  calc: (v) => ({ Qdot: v.U * v.A * v.dTlm }),
  steps: (v, r) => `Q̇ = UAΔT_lm = ${v.U} × ${v.A} × ${v.dTlm} = ${fmtNum(r.Qdot)} W`
});

  inputs: [

reg({

reg({
  id: 'hollow-shaft', cat: 'machine', name: 'Hollow Circular Shaft Properties',
  desc: 'Properties of a hollow circular shaft.',
  eq: 'A = π(D²−d²)/4,  I = π(D⁴−d⁴)/64,  J = π(D⁴−d⁴)/32',
  inputs: [
    { id: 'D', label: 'Outer Diameter', unitType: 'length', defaultUnit: 'mm' },
    { id: 'd', label: 'Inner Diameter', unitType: 'length', defaultUnit: 'mm' }
  ],
  outputs: [

});

reg({
  id: 'spring-rate', cat: 'machine', name: 'Helical Compression Spring Rate',
  desc: 'Spring rate for a helical compression spring.',
  eq: 'k = G d⁴ / (8 D³ n)',
  inputs: [
    { id: 'G', label: 'Shear Modulus', unitType: 'pressure', defaultUnit: 'GPa' },
    { id: 'd', label: 'Wire Diameter', unitType: 'length', defaultUnit: 'mm' },

  ],

});

reg({
  id: 'horiz-tank', cat: 'industrial', name: 'Horizontal Cylindrical Tank Volume at Depth',
  desc: 'Volume of liquid in a partially filled horizontal cylindrical tank.',
  eq: 'V = L × [r² cos⁻¹((r−h)/r) − (r−h)√(2rh−h²)]',
  inputs: [
    { id: 'r', label: 'Tank Radius', unitType: 'length', defaultUnit: 'm' },
    { id: 'L', label: 'Tank Length', unitType: 'length', defaultUnit: 'm' },
    { id: 'h', label: 'Liquid Depth', unitType: 'length', defaultUnit: 'm' }
  ],
  outputs: [{ id: 'V', label: 'Liquid Volume', unitType: 'volume', defaultUnit: 'm3' }],
  example: { r: 1, L: 3, h: 1.2 },
  assumptions: 'Horizontal cylinder, circular cross-section. 0 ≤ h ≤ 2r. Uses circular segment geometry.',
  calc: (v) => {
    if (v.h < 0 || v.h > 2*v.r) throw new Error('Liquid depth must be between 0 and 2r.');
    const r = v.r, h = v.h;
    const term = Math.sqrt(Math.max(0, 2*r*h - h*h));
    const angle = Math.acos((r - h) / r);
    return { V: v.L * (r*r*angle - (r-h)*term) };
  },
  steps: (v, r) => {
    const angle = Math.acos((v.r - v.h) / v.r);
    const term = Math.sqrt(Math.max(0, 2*v.r*v.h - v.h*v.h));
    return `V = L × [r² cos⁻¹((r−h)/r) − (r−h)√(2rh−h²)]\nAngle = ${fmtNum(angle)} rad\nV = ${v.L} × [${v.r}² × ${fmtNum(angle)} − (${v.r}−${v.h}) × ${fmtNum(term)}] = ${fmtNum(r.V)} m³`;
  }
});

  assumptions: 'Ideal force, no friction or efficiency losses.',
  calc: (v) => {
    const P_Pa = toBase(v.P, 'bar', 'pressure');
    const D_m = toBase(v.D, 'mm', 'length');
    const A = Math.PI * D_m * D_m / 4;
    return { F: P_Pa * A };
  },
  steps: (v, r) => `A = πD²/4 = ${fmtNum(Math.PI * Math.pow(toBase(v.D,'mm','length'),2)/4)} m²\nF = P × A = ${fmtNum(toBase(v.P,'bar','pressure'))} × A = ${fmtNum(r.F)} N`
});

reg({
  id: 'hydraulic-speed', cat: 'industrial', name: 'Hydraulic Cylinder Speed',
  desc: 'Extension speed from flow rate and bore area.',
  eq: 'v = Q / A',
  inputs: [
    { id: 'Q', label: 'Flow Rate', unitType: 'volFlow', defaultUnit: 'L/min' },
    { id: 'D', label: 'Bore Diameter', unitType: 'length', defaultUnit: 'mm' }
  ],
  outputs: [{ id: 'v', label: 'Speed', unitType: 'velocity', defaultUnit: 'm/s' }],
  example: { Q: 20, D: 100 },
  assumptions: 'Ideal flow, no leakage.',
  calc: (v) => {
    const Q_m3s = toBase(v.Q, 'L/min', 'volFlow');
    const D_m = toBase(v.D, 'mm', 'length');
    const A = Math.PI * D_m * D_m / 4;
    if (A <= 0) throw new Error('Bore area must be positive.');
    return { v: Q_m3s / A };
  },
  steps: (v, r) => `v = Q/A = ${fmtNum(toBase(v.Q,'L/min','volFlow'))} / ${fmtNum(Math.PI*Math.pow(toBase(v.D,'mm','length'),2)/4)} = ${fmtNum(r.v)} m/s`
});

reg({
  id: 'hydraulic-power-ind', cat: 'industrial', name: 'Hydraulic Power (Industrial)',
  desc: 'Hydraulic power from pressure and flow.',
  eq: 'P = ΔP × Q',
  inputs: [
    { id: 'dP', label: 'Pressure Difference', unitType: 'pressure', defaultUnit: 'bar' },
    { id: 'Q', label: 'Flow Rate', unitType: 'volFlow', defaultUnit: 'L/min' }
  ],
  outputs: [{ id: 'Ph', label: 'Hydraulic Power', unitType: 'power', defaultUnit: 'kW' }],
  example: { dP: 200, Q: 20 },
  assumptions: 'Ideal hydraulic power.',
  calc: (v) => {
    const dP_Pa = toBase(v.dP, 'bar', 'pressure');
    const Q_m3s = toBase(v.Q, 'L/min', 'volFlow');
    return { Ph: dP_Pa * Q_m3s };
  },
  steps: (v, r) => `P = ΔP × Q = ${fmtNum(toBase(v.dP,'bar','pressure'))} Pa × ${fmtNum(toBase(v.Q,'L/min','volFlow'))} m³/s = ${fmtNum(r.Ph)} W = ${fmtNum(r.Ph/1000)} kW`
});

reg({
  id: 'unit-conv', cat: 'industrial', name: 'Basic Unit Conversions',
  desc: 'Convert between common engineering units.',
  eq: 'Unit conversion',
  inputs: [
    { id: 'value', label: 'Value', unitType: 'dimensionless', defaultUnit: '' },
    { id: 'from', label: 'From', unitType: 'select', options: ['mm', 'm', 'in', 'ft', 'kg', 'lb', 'N', 'lbf', 'Pa', 'psi', 'bar', 'W', 'hp'], defaultUnit: '' },
    { id: 'to', label: 'To', unitType: 'select', options: ['mm', 'm', 'in', 'ft', 'kg', 'lb', 'N', 'lbf', 'Pa', 'psi', 'bar', 'W', 'hp'], defaultUnit: '' }
  ],
  outputs: [{ id: 'result', label: 'Result', unitType: 'dimensionless', defaultUnit: '' }],
  example: { value: 25.4, from: 'mm', to: 'in' },
  assumptions: 'Standard conversion factors.',
  calc: (v) => {
    // Build a simple conversion map
    const lengthUnits = { mm: 0.001, m: 1, in: 0.0254, ft: 0.3048 };
    const massUnits = { kg: 1, lb: 0.45359237 };
    const forceUnits = { N: 1, lbf: 4.4482216152605 };
    const pressureUnits = { Pa: 1, psi: 6894.757293168, bar: 1e5 };
    const powerUnits = { W: 1, hp: 745.69987158227 };

    const allUnits = { ...lengthUnits, ...massUnits, ...forceUnits, ...pressureUnits, ...powerUnits };
    if (!allUnits[v.from] || !allUnits[v.to]) throw new Error('Select valid units.');
    // Determine dimension by looking up in each group
    const groups = [lengthUnits, massUnits, forceUnits, pressureUnits, powerUnits];
    let fromBase = null, toBaseFactor = null;
    for (const g of groups) {
      if (g[v.from] !== undefined) fromBase = g[v.from];
      if (g[v.to] !== undefined) toBaseFactor = g[v.to];
    }
    if (fromBase === null || toBaseFactor === null) throw new Error('Incompatible unit types.');
    // Check same group
    let sameGroup = false;
    for (const g of groups) {
      if (g[v.from] !== undefined && g[v.to] !== undefined) sameGroup = true;
    }
    if (!sameGroup) throw new Error('Cannot convert between different physical quantities.');
    return { result: (v.value * fromBase) / toBaseFactor };
  },
  steps: (v, r) => `Convert ${v.value} ${v.from} to ${v.to}\nResult: ${fmtNum(r.result)} ${v.to}`
});
